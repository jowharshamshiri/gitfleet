[package]
name = "supergit"
version = "0.1.0"
edition = "2021"
authors = ["SuperGit Contributors"]
description = "A Git submodule manager for synchronized superbranches"
license = "MIT"

[[bin]]
name = "supergit"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
indicatif = "0.17"
dialoguer = "0.11"

# Git operations
git2 = "0.19"

# Error handling
anyhow = "1.0"
thiserror = "1.0"


# Async/parallel
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
